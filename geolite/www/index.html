<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>GeoLite Mobile</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1c2421;background:#f3f5f4}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#hdr{background:#1f6f4a;color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}
#hdr h1{font-size:16px;margin:0;flex:1;font-weight:600}
button,select,input[type=number],input[type=text],textarea{font:inherit}
button{background:#fff;color:#1f6f4a;border:1px solid #1f6f4a;border-radius:6px;padding:6px 10px;cursor:pointer}
button.pri{background:#1f6f4a;color:#fff}
button.sm{padding:3px 7px;font-size:12px}
#hdr button{border-color:#fff}
#main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex}
#view-map{flex-direction:row}
#map{flex:1;min-width:0;height:100%}
#side{width:360px;max-width:100%;overflow:auto;background:#fff;border-right:1px solid #cfd6d2;padding:10px;display:none}
#side.on{display:block}
@media(max-width:760px){#side{position:absolute;inset:0;width:auto;z-index:1000}}
#coord{position:absolute;left:8px;bottom:8px;z-index:500;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:4px;font-size:11px;pointer-events:none}
#tabs{display:flex;background:#fff;border-top:1px solid #cfd6d2;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;border-radius:0;background:#fff;color:#55615b;padding:10px 2px;font-size:12px}
#tabs button.on{color:#1f6f4a;font-weight:700;box-shadow:inset 0 3px 0 #1f6f4a}
h3{margin:4px 0 8px}
label{display:block;margin:6px 0}
label select,label input[type=number],label input[type=text]{width:100%;padding:5px;margin-top:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.layer{border:1px solid #dbe1de;border-radius:8px;padding:6px 8px;margin-bottom:6px;background:#fafcfb}
.layer .top{display:flex;align-items:center;gap:6px}
.layer b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer small{color:#68746e}
.layer .btns{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid #0004;display:inline-block}
#modal{position:fixed;inset:0;background:#0007;z-index:5000;display:none;align-items:center;justify-content:center;padding:10px}
#modal.on{display:flex}
#modalBody{background:#fff;border-radius:10px;padding:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
#modalBody.wide{max-width:95vw}
table.at{border-collapse:collapse;font-size:12px}
table.at th,table.at td{border:1px solid #d4dad7;padding:2px 6px;white-space:nowrap}
table.at th{background:#eef2f0;position:sticky;top:0}
.cl{display:flex;align-items:center;gap:8px;margin:3px 0}
.cl input{width:38px;height:24px;padding:0;border:0}
fieldset{border:1px solid #dbe1de;border-radius:8px;margin:8px 0}
legend{font-size:12px;color:#55615b}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;z-index:6000;display:none;max-width:90vw}
.lbl{background:transparent;border:0;box-shadow:none;font-size:11px;font-weight:600;color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff}
.lbl:before{display:none}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px;background:#fff;border-bottom:1px solid #cfd6d2}
#view-layout,#view-python{flex-direction:column}
#lay-scroll{flex:1;overflow:auto;background:#8a928e;padding:8px}
#lay-wrap{position:relative}
#page{background:#fff;transform-origin:0 0;position:absolute;left:0;top:0;display:flex;flex-direction:column;padding:28px;gap:10px;box-shadow:0 2px 10px #0006;color:#111}
.p-title{font-size:30px;font-weight:700;outline:none;border-bottom:3px solid #1f6f4a;padding-bottom:4px}
.p-body{flex:1;display:flex;gap:14px;min-height:0}
#lay-map{flex:1;border:2px solid #222;min-width:0}
.p-side{width:230px;display:flex;flex-direction:column;gap:10px}
.box{border:1px solid #888;padding:8px;font-size:13px}
.box b{display:block;margin-bottom:4px}
.lg-l{margin-bottom:6px}.lg-l>div{display:flex;align-items:center;gap:6px;font-size:12px}
.lg-sw{width:16px;height:12px;border:1px solid #0006;display:inline-block;flex:none}
.p-foot{display:flex;justify-content:space-between;font-size:12px;color:#444;gap:10px}
.p-foot span{outline:none}
#py-code{flex:1;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;padding:8px;border:0;border-bottom:1px solid #cfd6d2;resize:none;width:100%}
#py-out{height:34%;margin:0;overflow:auto;background:#10201a;color:#d6f5e4;padding:8px;font-size:12px;white-space:pre-wrap}
@media print{
 body.printing{display:block;height:auto;overflow:visible;background:#fff}
 body.printing #hdr,body.printing #tabs,body.printing .tb,body.printing #toast{display:none!important}
 body.printing #main{position:static}
 body.printing .view:not(#view-layout){display:none!important}
 body.printing #view-layout{position:static;display:block}
 body.printing #lay-scroll{overflow:visible;padding:0;background:#fff}
 body.printing #page{box-shadow:none;transform:none!important;position:static}
 body.printing #lay-wrap{width:auto!important;height:auto!important}
 @page{margin:0}
}
<style id="leaflet-min">
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;background:#e4e9e6;-webkit-tap-highlight-color:transparent;font-family:inherit}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none;display:block}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-zoom-animated{transform-origin:0 0}svg.leaflet-zoom-animated{will-change:transform}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive{cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.45);border-radius:4px}
.leaflet-bar a{background:#fff;border-bottom:1px solid #ccc;width:30px;height:30px;line-height:30px;display:block;text-align:center;text-decoration:none;color:#000}
.leaflet-bar a:first-child{border-top-left-radius:4px;border-top-right-radius:4px}
.leaflet-bar a:last-child{border-bottom-left-radius:4px;border-bottom-right-radius:4px;border-bottom:none}
.leaflet-control-zoom-in,.leaflet-control-zoom-out{font:bold 18px monospace}
.leaflet-control-attribution,.leaflet-control-scale-line{padding:0 5px;color:#333;line-height:1.4}
.leaflet-control-attribution{background:rgba(255,255,255,.8);margin:0;font-size:11px}
.leaflet-control-scale-line{border:2px solid #777;border-top:none;line-height:1.1;padding:2px 5px 1px;white-space:nowrap;background:rgba(255,255,255,.8);font-size:11px}
.leaflet-control-scale-line:not(:first-child){border-top:2px solid #777;border-bottom:none;margin-top:-2px}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:10px;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.4)}
.leaflet-popup-content{margin:10px 22px 10px 14px;line-height:1.3;font-size:13px;min-height:1px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.4)}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;width:24px;height:24px;font:16px/24px sans-serif;color:#757575;text-decoration:none;text-align:center}
.leaflet-tooltip{position:absolute;padding:4px 6px;background:#fff;border:1px solid #fff;border-radius:3px;color:#222;white-space:nowrap;user-select:none;pointer-events:none;box-shadow:0 1px 3px rgba(0,0,0,.4)}
</style>

<body>
<div id="hdr"><h1>GeoLite Mobile</h1>
 <button id="btn-open">+ Open data</button>
 <button id="btn-gdb" title="Open or export File Geodatabase">FileGDB</button>
 <input type="file" id="gdb-file" accept=".zip" hidden>
 <input type="file" id="gdb-folder" webkitdirectory directory multiple hidden>
 <button id="btn-gps" title="Capture current GPS location">GPS</button>
 <button id="btn-digitize" title="Create a GIS feature">+ Feature</button>
 <select id="basemap-select" aria-label="Basemap" style="max-width:125px"><option value="osm">Street</option><option value="imagery">Satellite</option></select>
 <input type="file" id="file" multiple hidden>
</div>
<div id="main">
 <section id="view-map" class="view on">
  <div id="side"></div>
  <div id="map"></div><div id="coord"></div>
 </section>
 <section id="view-layout" class="view">
  <div class="tb">
   <select id="lay-size"><option value="A4">A4</option><option value="A3">A3</option><option value="Letter">Letter</option></select>
   <select id="lay-orient"><option value="l">Landscape</option><option value="p">Portrait</option></select>
   <label style="margin:0"><input type="checkbox" id="lay-base" checked> Basemap</label>
   <button class="sm" id="lay-sync">Use map extent</button>
   <button class="sm pri" id="lay-png">Export PNG</button>
   <button class="sm" id="lay-print">Print / PDF</button>
  </div>
  <div id="lay-scroll"><div id="lay-wrap"><div id="page">
    <div class="p-title" contenteditable="true">Map title</div>
    <div class="p-body">
      <div id="lay-map"></div>
      <div class="p-side">
        <div class="box"><b>Legend</b><div id="lay-legend"></div></div>
        <div class="box" style="text-align:center"><b>North</b>
          <svg width="46" height="60" viewBox="0 0 46 60"><polygon points="23,2 36,52 23,42 10,52" fill="#222"/><polygon points="23,2 23,42 10,52" fill="#fff" stroke="#222"/><text x="23" y="60" font-size="10" text-anchor="middle">N</text></svg></div>
        <div class="box" contenteditable="true" style="flex:1;outline:none"><b>Notes</b>Edit this text.</div>
      </div>
    </div>
    <div class="p-foot"><span contenteditable="true">Author</span><span id="lay-date"></span><span>Web Mercator (EPSG:3857)</span></div>
  </div></div></div>
 </section>
 <section id="view-python" class="view">
  <div class="tb">
   <button class="sm pri" id="py-run">▶ Run</button>
   <button class="sm" id="py-pkgs">Load numpy/pandas/shapely</button>
   <select id="py-ex"><option value="">Examples…</option><option value="list">List layers</option><option value="stats">Area stats (pure Python)</option><option value="shp">Buffer with shapely</option></select>
   <span id="py-status" style="font-size:12px;color:#68746e"></span>
  </div>
  <textarea id="py-code" spellcheck="false">print(layer_names())</textarea>
  <pre id="py-out">Python runs in the browser (Pyodide). Helpers: layer_names(), get_layer(name), add_layer(name, geojson), zoom_to(name)
First run downloads the Python runtime (~10 MB) and needs internet.</pre>
 </section>
</div>
<div id="tabs">
 <button data-tab="map" class="on">Map</button>
 <button data-tab="layers">Layers</button>
 <button data-tab="tools">Tools</button>
 <button data-tab="layout">Layout</button>
 <button data-tab="python">Python</button>
</div>
<div id="modal"><div id="modalBody"></div></div>
<div id="toast"></div>

<script>
const WEB_ONLY=false; // true in the sandboxed hosted build: no tiles, copy-to-export
window.L_DISABLE_3D = true; // friendlier to html2canvas export
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;function toast(m,ms=3500){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',ms)}

/* ---------- library loading (local vendor/ first, CDN fallback) ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=()=>res(src);s.onerror=()=>{s.remove();rej(new Error(src))};document.head.appendChild(s)})}
async function loadLib(urls,check){if(WEB_ONLY)urls=urls.filter(u=>!u.startsWith('vendor/'));if(check&&check())return urls[0];for(const u of urls){try{await loadScript(u);if(!check||check())return u}catch(e){}}return null}
function loadCss(urls){if(WEB_ONLY)return;const l=document.createElement('link');l.rel='stylesheet';let i=0;l.href=urls[0];l.onerror=()=>{if(++i<urls.length)l.href=urls[i]};document.head.appendChild(l)}
function need(g,label){if(!window[g])throw new Error((label||g)+' library not loaded. Connect to the internet once (or bundle libs) and reload.')}

/* ---------- state ---------- */
const S={layers:[],id:1};
let map,layMap,layOsm,osm;
const byId=id=>S.layers.find(l=>l.id==id);
const byName=n=>S.layers.find(l=>l.name===n&&l.type==='vector');
const fc=a=>({type:'FeatureCollection',features:a});

/* ---------- colors ---------- */
const PAL=['#3b82c4','#e07a3a','#3aa76d','#c4453b','#8a63c9','#d1a72e','#2aa6b8','#c4559e'];
const RAMPS={Viridis:['#440154','#3b528b','#21908d','#5dc863','#fde725'],YlOrRd:['#ffffb2','#fecc5c','#fd8d3c','#f03b20','#bd0026'],Blues:['#eff3ff','#bdd7e7','#6baed6','#3182bd','#08519c'],RdYlGn:['#d7191c','#fdae61','#ffffbf','#a6d96a','#1a9641'],Spectral:['#d7191c','#fdae61','#ffffbf','#abdda4','#2b83ba'],Terrain:['#2b83ba','#abdda4','#ffffbf','#fdae61','#8c510a','#ffffff'],Grayscale:['#000000','#ffffff']};
const hex2rgb=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]};
const rgb2hex=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
function rampAt(name,t){const R=RAMPS[name]||RAMPS.Viridis;t=Math.min(1,Math.max(0,t));const x=t*(R.length-1),i=Math.min(R.length-2,Math.floor(x)),f=x-i,a=hex2rgb(R[i]),b=hex2rgb(R[i+1]);return a.map((v,k)=>v+(b[k]-v)*f)}
const fmt=v=>+(+v).toPrecision(4);

/* ---------- CRS math for rasters ---------- */
const R_E=6378137;
const mercY=lat=>R_E*Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));
const invMercLat=y=>(2*Math.atan(Math.exp(y/R_E))-Math.PI/2)*180/Math.PI;
const WGS={a:6378137,f:1/298.257223563};WGS.e2=WGS.f*(2-WGS.f);WGS.ep2=WGS.e2/(1-WGS.e2);
function utmFwd(lon,lat,zone,south){const {a,e2,ep2}=WGS,k0=0.9996,lon0=((zone-1)*6-180+3)*Math.PI/180,phi=lat*Math.PI/180,lam=lon*Math.PI/180;
 const N=a/Math.sqrt(1-e2*Math.sin(phi)**2),T=Math.tan(phi)**2,C=ep2*Math.cos(phi)**2,A=Math.cos(phi)*(lam-lon0);
 const M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*phi-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*phi)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*phi)-(35*e2**3/3072)*Math.sin(6*phi));
 const x=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
 let y=k0*(M+N*Math.tan(phi)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
 if(south)y+=1e7;return[x,y]}
function utmInv(x,y,zone,south){const {a,e2,ep2}=WGS,k0=0.9996;x-=500000;if(south)y-=1e7;const lon0=((zone-1)*6-180+3)*Math.PI/180;
 const M=y/k0,mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2**3/256)),e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
 const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
 const N1=a/Math.sqrt(1-e2*Math.sin(p1)**2),T1=Math.tan(p1)**2,C1=ep2*Math.cos(p1)**2,R1=a*(1-e2)/Math.pow(1-e2*Math.sin(p1)**2,1.5),D=x/(N1*k0);
 const phi=p1-(N1*Math.tan(p1)/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
 const lam=lon0+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(p1);
 return[lam*180/Math.PI,phi*180/Math.PI]}
const MERC={fwd:(lo,la)=>[R_E*lo*Math.PI/180,mercY(la)],inv:(x,y)=>[x/R_E*180/Math.PI,invMercLat(y)]};
function crsOf(keys){const e=keys.ProjectedCSTypeGeoKey||keys.GeographicTypeGeoKey;
 if(!e||e===4326||e===4269||e===4283||e===32767)return{fwd:(lo,la)=>[lo,la],inv:(x,y)=>[x,y]};
 if(e===3857||e===900913)return MERC;
 if(e>=32601&&e<=32660){const z=e-32600;return{fwd:(lo,la)=>utmFwd(lo,la,z,false),inv:(x,y)=>utmInv(x,y,z,false)}}
 if(e>=32701&&e<=32760){const z=e-32700;return{fwd:(lo,la)=>utmFwd(lo,la,z,true),inv:(x,y)=>utmInv(x,y,z,true)}}
 throw new Error('Unsupported raster CRS EPSG:'+e+'. Use WGS84, Web Mercator or UTM (reproject first with QGIS/GDAL).')}

/* ---------- layers ---------- */
function geomKind(data){const k=new Set();for(const f of data.features){const t=f.geometry?.type||'';k.add(/Polygon/.test(t)?'polygon':/Line/.test(t)?'line':/Point/.test(t)?'point':'')}k.delete('');return k.size===1?[...k][0]:k.size?'mixed':'polygon'}
function defaultStyle(kind,i){const c=PAL[i%PAL.length];return{mode:'single',fill:c,stroke:kind==='polygon'?'#333333':kind==='point'?'#ffffff':c,strokeW:kind==='line'?2.5:1,opacity:kind==='polygon'?0.6:0.9,radius:6,label:'',field:'',ramp:'Viridis',reverse:false,n:5,method:'equal',classes:[]}}
function normFC(g){if(!g)throw new Error('Empty file');if(g.type==='FeatureCollection')return fc(g.features.filter(f=>f&&f.geometry).map(f=>({type:'Feature',properties:f.properties||{},geometry:f.geometry})));

/* ---------- leaflet layer builders ---------- */
function popupHTML(f){const p=f.properties||{};const k=Object.keys(p).slice(0,40);return k.length?'<table class="at">'+k.map(x=>`<tr><th>${esc(x)}</th><td>${esc(p[x])}</td></tr>`).join('')+'</table>':'(no attributes)'}

/* ---------- raster ---------- */
async function addRasterFile(f,name){need('GeoTIFF','GeoTIFF reader');

 let mn=Infinity,mx=-Infinity;const b0=bands[0];for(let i=0;i<b0.length;i++){const v=b0[i];if(v===nodata||!isFinite(v))continue;if(v<mn)mn=v;if(v>mx)mx=v}

 const west=Math.min(...cs.map(c=>c[0])),east=Math.max(...cs.map(c=>c[0])),south=Math.min(...cs.map(c=>c[1])),north=Math.max(...cs.map(c=>c[1]));

function addComputedRaster(name,bands,w,h,bounds,zoom=true){const [[s,we],[n,e]]=bounds,bb=[R_E*we*Math.PI/180,mercY(s),R_E*e*Math.PI/180,mercY(n)];

  raster:{bands,nodata:null,w,h,outW:w,outH:h,lut,rgb:false,bmm:[[mn,mx]],min:mn,max:mx,bounds,crs:MERC,bb,url:null}};

/* ---------- raster calculator ---------- */
const IF=(c,a,b)=>c?a:b;

  if(bad){out[p]=NaN;continue}const r=Number(fn(v,IF));out[p]=isFinite(r)?r:NaN}

function renderRaster(l){const r=l.raster,st=l.style,cv=document.createElement('canvas');cv.width=r.outW;cv.height=r.outH;const ctx=cv.getContext('2d'),id=ctx.createImageData(r.outW,r.outH),d=id.data;

/* ---------- file import ---------- */
function parseCSV(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}else if(c=='"')q=true;else if(c==','){row.push(cur);cur=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}else cur+=c}row.push(cur);if(row.length>1||row[0]!=='')rows.push(row);return rows}
function csvToFC(text){const rows=parseCSV(text.replace(/^﻿/,''));if(rows.length<2)throw new Error('CSV is empty');const h=rows[0].map(s=>s.trim()),lh=h.map(s=>s.toLowerCase());

async function openFile(f){const n=f.name.toLowerCase(),base=f.name.replace(/\.[^.]+$/,'');

 if(n.endsWith('.zip')){need('shp','Shapefile reader');const r=await shp(await f.arrayBuffer());const a=Array.isArray(r)?r:[r];a.forEach(x=>addVector(a.length>1&&x.fileName?x.fileName:base,x));return}

 if(j.geolite===1){S.layers.slice().forEach(l=>removeLayer(l.id));j.layers.slice().reverse().forEach(x=>addVector(x.name,x.data,x.style,x.visible,false));if(S.layers.length)zoomTo(S.layers[0],false);return toast('Project loaded')}

/* ---------- saving ---------- */
function blobToB64(b){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(b)})}

 const t=$('#exp-t');t.value=text;$('#exp-c').onclick=async()=>{try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){t.focus();t.select();toast('Select all and copy manually')}}}

/* ---------- geoprocessing (Turf.js) ---------- */
const feats=l=>l.data.features.filter(f=>f.geometry);
const flat=f=>turf.flatten(f).features;
const polysOf=l=>feats(l).flatMap(f=>flat(f)).filter(g=>g.geometry.type==='Polygon');
function unionAll(a){let u=null;for(const p of a){try{u=u?(turf.union(u,p)||u):p}catch(e){console.warn('union skip',e)}}return u}
const P={area:(k,label,def)=>({k,t:'area',label,def}),layer:(k,label,geom)=>({k,t:'layer',label,geom}),num:(k,label,def)=>({k,t:'num',label,def}),sel:(k,label,opts)=>({k,t:'sel',label,opts}),chk:(k,label,def)=>({k,t:'chk',label,def}),field:(k,label,of)=>({k,t:'field',label,of}),text:(k,label,def)=>({k,t:'text',label,def}),extent:(k,label)=>({k,t:'extent',label})};
const TOOLS=[
 {name:'Raster calculator',raster:true,params:[P.area('expr','Expression','')],
  run:(p,outName)=>{const l=runRasterCalc(p.expr,outName);return{raster:l}}},
 {name:'Buffer',params:[P.layer('input','Input layer'),P.num('dist','Distance',1),P.sel('units','Units',['kilometers','meters','miles']),P.num('steps','Segments',8),P.chk('dissolve','Dissolve result')],
  run:p=>{let out=feats(p.input).map(f=>{const b=turf.buffer(f,+p.dist,{units:p.units,steps:+p.steps});if(b)b.properties={...f.properties};return b}).filter(Boolean);if(p.dissolve){const u=unionAll(out);out=u?[u]:[]}return fc(out)}},
 {name:'Clip',params:[P.layer('input','Input layer'),P.layer('overlay','Clip layer (polygons)','polygon')],
  run:p=>{const mask=unionAll(polysOf(p.overlay));if(!mask)throw new Error('Clip layer has no polygons');const out=[];
   for(const f of feats(p.input)){for(const g of flat(f)){const t=g.geometry.type;try{
    if(t==='Polygon'){const i=turf.intersect(g,mask);if(i){i.properties={...f.properties};out.push(i)}}
    else if(t==='Point'){if(turf.booleanPointInPolygon(g,mask))out.push(g)}
    else if(t==='LineString'){const sp=turf.lineSplit(g,mask),segs=sp.features.length?sp.features:[g];for(const s of segs){const mid=turf.along(s,turf.length(s)/2);if(turf.booleanPointInPolygon(mid,mask)){s.properties={...f.properties};out.push(s)}}}}catch(e){console.warn(e)}}}
   return fc(out)}},
 {name:'Intersection',params:[P.layer('input','Input polygons','polygon'),P.layer('overlay','Overlay polygons','polygon')],
  run:p=>{const A=polysOf(p.input),B=polysOf(p.overlay),out=[];for(const a of A){const ba=turf.bbox(a);for(const b of B){const bb=turf.bbox(b);if(ba[0]>bb[2]||ba[2]<bb[0]||ba[1]>bb[3]||ba[3]<bb[1])continue;try{const i=turf.intersect(a,b);if(i){i.properties={...a.properties,...b.properties};out.push(i)}}catch(e){}}}return fc(out)}},
 {name:'Difference',params:[P.layer('input','Input polygons','polygon'),P.layer('overlay','Subtract polygons','polygon')],
  run:p=>{const m=unionAll(polysOf(p.overlay)),out=[];for(const a of polysOf(p.input)){try{const d=m?turf.difference(a,m):a;if(d){d.properties={...a.properties};out.push(d)}}catch(e){}}return fc(out)}},
 {name:'Union (merge all)',params:[P.layer('input','Input polygons','polygon')],run:p=>{const u=unionAll(polysOf(p.input));if(u)u.properties={};return fc(u?[u]:[])}},
 {name:'Dissolve by field',params:[P.layer('input','Input polygons','polygon'),P.field('field','Dissolve field','input')],
  run:p=>{const g={};for(const f of polysOf(p.input)){const k=String(f.properties?.[p.field]);(g[k]=g[k]||[]).push(f)}return fc(Object.entries(g).map(([k,a])=>{const u=unionAll(a);if(u)u.properties={[p.field]:k};return u}).filter(Boolean))}},
 {name:'Centroids',params:[P.layer('input','Input layer')],run:p=>fc(feats(p.input).map(f=>turf.centroid(f,{properties:{...f.properties}})))},
 {name:'Convex hull',params:[P.layer('input','Input layer')],run:p=>{const h=turf.convex(p.input.data);return fc(h?[h]:[])}},
 {name:'Bounding box',params:[P.layer('input','Input layer')],run:p=>fc([turf.bboxPolygon(turf.bbox(p.input.data))])},
 {name:'Simplify',params:[P.layer('input','Input layer'),P.num('tol','Tolerance (degrees)',0.001),P.chk('hq','High quality')],
  run:p=>fc(feats(p.input).map(f=>/Point/.test(f.geometry.type)?f:turf.simplify(f,{tolerance:+p.tol,highQuality:p.hq,mutate:false})))},
 {name:'Voronoi polygons',params:[P.layer('input','Input points','point')],
  run:p=>{const pts=feats(p.input).flatMap(f=>flat(f)).filter(g=>g.geometry.type==='Point');if(pts.length<2)throw new Error('Need at least 2 points');const b=turf.bbox(fc(pts)),dx=(b[2]-b[0])*.1||.01,dy=(b[3]-b[1])*.1||.01;
   const v=turf.voronoi(fc(pts),{bbox:[b[0]-dx,b[1]-dy,b[2]+dx,b[3]+dy]});return fc(v.features.map((c,i)=>{if(c)c.properties={...pts[i].properties};return c}).filter(Boolean))}},
 {name:'Create grid',params:[P.extent('extent','Extent'),P.sel('type','Grid type',['square','hex','triangle']),P.num('size','Cell size (km)',5)],
  run:p=>{const bb=p.extent==='view'?(b=>[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()])(map.getBounds()):turf.bbox(byId(p.extent).data),cs=+p.size;
   const w=turf.distance([bb[0],bb[1]],[bb[2],bb[1]]),h=turf.distance([bb[0],bb[1]],[bb[0],bb[3]]);if(w*h/(cs*cs)>30000)throw new Error('Too many cells — increase cell size');
   const o={units:'kilometers'},g=p.type==='hex'?turf.hexGrid(bb,cs,o):p.type==='triangle'?turf.triangleGrid(bb,cs,o):turf.squareGrid(bb,cs,o);g.features.forEach((f,i)=>f.properties={id:i+1});return g}},
 {name:'Points in polygons (select)',params:[P.layer('input','Points','point'),P.layer('overlay','Polygons','polygon')],
  run:p=>fc(turf.pointsWithinPolygon(fc(feats(p.input).flatMap(f=>flat(f)).filter(g=>g.geometry.type==='Point')),fc(polysOf(p.overlay))).features)},
 {name:'Count points in polygons',params:[P.layer('overlay','Polygons','polygon'),P.layer('input','Points','point')],
  run:p=>{const pts=fc(feats(p.input).flatMap(f=>flat(f)).filter(g=>g.geometry.type==='Point'));return fc(polysOf(p.overlay).map(a=>({...a,properties:{...a.properties,count:turf.pointsWithinPolygon(pts,a).features.length}})))}},
 {name:'Add geometry attributes',params:[P.layer('input','Input layer')],
  run:p=>fc(feats(p.input).map(f=>{const t=f.geometry.type,q={...f.properties};if(/Polygon/.test(t)){q.area_km2=+(turf.area(f)/1e6).toFixed(6);q.perim_km=+flat(f).reduce((s,g)=>s+turf.length(turf.polygonToLine(g)),0).toFixed(4)}else if(/Line/.test(t))q.length_km=+turf.length(f).toFixed(4);else{const c=turf.centroid(f).geometry.coordinates;q.lon=c[0];q.lat=c[1]}return{...f,properties:q}}))},
 {name:'Extract by attribute',params:[P.layer('input','Input layer'),P.field('field','Field','input'),P.sel('op','Operator',['=','≠','>','<','≥','≤','contains']),P.text('value','Value','')],
  run:p=>{const v=p.value,nv=parseFloat(v);return fc(feats(p.input).filter(f=>{const x=f.properties?.[p.field];const xs=String(x),xn=parseFloat(x);switch(p.op){case'=':return xs===v||(isFinite(xn)&&xn===nv);case'≠':return!(xs===v||(isFinite(xn)&&xn===nv));case'>':return xn>nv;case'<':return xn<nv;case'≥':return xn>=nv;case'≤':return xn<=nv;default:return xs.toLowerCase().includes(v.toLowerCase())}}))}}
];

async function initPy(){if(pyo)return pyo;if(pyLoading)return pyLoading;pyLoading=(async()=>{$('#py-status').textContent='Loading Python…';

 const p=await loadPyodide({indexURL:u});p.setStdout({batched:pyOut});p.setStderr({batched:pyOut});
 p.registerJsModule('qgisjs',{layer_names:()=>JSON.stringify(S.layers.filter(l=>l.type==='vector').map(l=>l.name)),get_layer:n=>{const l=byName(n);if(!l)throw new Error('No vector layer named '+n);return JSON.stringify(l.data)},add_layer:(n,s)=>{addVector(n,JSON.parse(s))},zoom_to:n=>{const l=byName(n);if(l){zoomTo(l);}}});
 await p.runPythonAsync(`import json, qgisjs\ndef layer_names(): return json.loads(qgisjs.layer_names())\ndef get_layer(name): return json.loads(qgisjs.get_layer(name))\ndef add_layer(name, geojson): qgisjs.add_layer(name, json.dumps(geojson))\ndef zoom_to(name): qgisjs.zoom_to(name)`);
 pyo=p;$('#py-status').textContent='Python ready';return p})().catch(e=>{pyLoading=null;$('#py-status').textContent='';throw e});return pyLoading}
async function runPy(){const code=$('#py-code').value;pyOut('>>> run');try{const p=await initPy();const r=await p.runPythonAsync(code);if(r!==undefined&&r!==null)pyOut(String(r))}catch(e){pyOut(String(e.message||e).split('\n').slice(-6).join('\n'))}}
const PY_EX={list:`for n in layer_names():\n    print(n, len(get_layer(n)['features']), 'features')`,

function openDigitizeDialog(){
 openModal('<h3>Create GIS feature</h3><p>Choose geometry, then tap the map to place vertices.</p><label>Feature type<select id="draw-type"><option value="Point">Point</option><option value="LineString">Line</option><option value="Polygon">Polygon</option></select></label><label>Layer name<input id="draw-layer" value="New features"></label><label>Feature name<input id="draw-name" value="New feature"></label><label>Description<input id="draw-desc" value=""></label><div class="row"><button class="pri" id="draw-start">Start drawing</button><button id="draw-cancel">Cancel</button></div><p id="draw-help"><small>Point: tap once. Line/Polygon: tap each vertex, then finish.</small></p>');
 $('#draw-cancel').onclick=()=>closeModal();
 $('#draw-start').onclick=()=>{
   const type=$('#draw-type').value,name=$('#draw-name').value||'Feature',layer=$('#draw-layer').value||'New features',desc=$('#draw-desc').value;
   closeModal();
   if(fieldDraw?.preview)map.removeLayer(fieldDraw.preview);
   fieldVertices=[];fieldDraw={type,name,layer,desc,preview:null};

function finishDigitize(coords){
 if(!fieldDraw)return;
 const d=fieldDraw;
 if(d.preview)map.removeLayer(d.preview);
 fieldDraw=null;fieldVertices=[];
 $('#btn-digitize').textContent='+ Feature';$('#btn-digitize').onclick=()=>openDigitizeDialog();
 if(d.type!=='Point'&&coords.length<(d.type==='LineString'?2:3)){toast('Not enough vertices to create this geometry');return}
 let geometry;
 if(d.type==='Point')geometry={type:'Point',coordinates:coords[0]};
 else if(d.type==='LineString')geometry={type:'LineString',coordinates:coords};
 else geometry={type:'Polygon',coordinates:[[...coords,coords[0]]]};
 const props={name:d.name,description:d.desc,created_at:new Date().toISOString()};
 const l=addVector(d.layer,fc([{type:'Feature',properties:props,geometry}]));
 toast('Feature created: '+d.name);
}


/* ---------- File Geodatabase via GDAL3.js ---------- */
let gdalInstance=null,gdalPromise=null,gdbSource=null;
async function getGdal(){
 if(gdalInstance)return gdalInstance;
 if(gdalPromise)return gdalPromise;
 gdalPromise=(async()=>{
   if(!window.initGdalJs)await loadScript('vendor/gdal3.js');
   if(!window.initGdalJs)throw new Error('GDAL library did not load. Rebuild the APK and try again.');
   const G=await window.initGdalJs({path:'vendor',useWorker:false});
   gdalInstance=G;return G;
 })().catch(e=>{gdalPromise=null;throw e});
 return gdalPromise;
}
async function openFileGDB(file){
 toast('Loading GDAL engine…',30000);
 const G=await getGdal();
 toast('Reading FileGDB…',30000);
 const opened=await G.open(file,[],['vsizip']);
 if(!opened.datasets||!opened.datasets.length)throw new Error((opened.errors||[]).join('; ')||'No readable dataset found');
 const ds=opened.datasets[0],info=await G.getInfo(ds);
 if(info.type!=='vector'||!info.layers?.length)throw new Error('No vector feature classes found in this geodatabase');
 let count=0;
 for(const lyr of info.layers){
   const sql='SELECT * FROM "'+String(lyr.name).replace(/"/g,'""')+'"';
   const out=await G.ogr2ogr(ds,['-f','GeoJSON','-t_srs','EPSG:4326','-sql',sql], 'fgdb_'+count);
   const bytes=await G.getFileBytes(out);
   const geo=JSON.parse(new TextDecoder().decode(bytes));
   if(geo.features?.length){addVector(lyr.name,geo,null,true,false);count++}
 }
 if(!count)throw new Error('The geodatabase opened, but no non-empty feature classes were converted.');
 gdbSource={file,info};
 toast('FileGDB opened: '+count+' feature class(es)');
 showTab('layers');
}
async function exportFileGDB(){
 const vec=S.layers.filter(l=>l.type==='vector');
 if(!vec.length){toast('There are no vector layers to export');return}
 try{
   const G=await getGdal();
   const outPath='/vsizip//output/GeoLite_edited.gdb.zip/GeoLite_edited.gdb';
   let created=false;
   for(const l of [...vec].reverse()){
     const safe=String(l.name||'layer').replace(/[^a-zA-Z0-9_]/g,'_').slice(0,50)||'layer';
     const file=new File([JSON.stringify(l.data)],safe+'.geojson',{type:'application/geo+json'});
     const ds=(await G.open(file)).datasets[0];
     const opts=['-f','OpenFileGDB','-nln',safe];
     if(created)opts.push('-update','-append');
     await G.ogr2ogr(ds,opts,outPath);
     created=true;
   }
   const zip=await G.getFileBytes('/output/GeoLite_edited.gdb.zip');
   await saveFile('GeoLite_edited.gdb.zip',new Blob([zip],{type:'application/zip'}),'application/zip');
   toast('FileGDB export completed');
 }catch(e){toast('FileGDB export failed: '+(e.message||e),9000);console.error(e)}
}
