name: Build aGIS Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "agis/**"
      - ".github/workflows/build-agis-apk.yml"
    branches: [agis-from-scratch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install
      - run: npm run vendor
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aGIS-debug-apk
          path: agis/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
